name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies & Prepare Assets
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          if [ -f index.js ]; then
            cp index.js www/index.html
          elif [ ! -f www/index.html ]; then
            echo '<html><body><h1>VaniVoice</h1></body></html>' > www/index.html
          fi

      - name: Sync Capacitor & Fix Cordova Module
        run: |
          npx cap sync android || npx cap add android
          if [ -f android/settings.gradle ]; then
            sed -i "/capacitor-cordova-android-plugins/d" android/settings.gradle
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
